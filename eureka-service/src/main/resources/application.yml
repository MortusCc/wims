# Eureka 注册中心配置（指导书 2.1.3.1 application.yml）
server:
  port: 8888
spring:
  application:
    name: eureka-server
  # 激活 profile:打包时用 -Dp.env=dev(本地)或 -Dp.env=k8s(集群)切换
  profiles:
    active: ${p.env}
eureka:
  instance:
    hostname: 127.0.0.1
    prefer-ip-address: true
  server:
    # 关闭自我保护：单机开发时避免长时间无心跳就注销服务
    enable-self-preservation: false
    # 下面几项用于让服务启动后尽快被发现（默认要 30-40 秒）
    eviction-interval-timer-in-ms: 4000
    wait-time-in-ms-when-sync-empty: 0
    responseCacheUpdateIntervalMs: 1
    use-read-only-response-cache: false
    renewal-percent-threshold: 0.49
  client:
    # 注册中心自身不注册也不拉取（指导书 2.1.3.1:单一注册中心本身不需要注册）
    register-with-eureka: false
    fetch-registry: false

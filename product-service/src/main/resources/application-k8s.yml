# 商品服务 —— 集群运行配置（指导书 4.3.3）
# k8s 集群内:MySQL 服务名 mysql (default 命名空间), Eureka 注册中心服务 eureka-service
spring:
  datasource:
    url: jdbc:mysql://mysql.default:3306/wims_product?characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.jdbc.Driver
eureka:
  client:
    service-url:
      defaultZone: http://eureka-service.stockmgr.svc.cluster.local:8888/eureka

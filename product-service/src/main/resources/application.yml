# 商品服务（服务提供者）配置 —— 指导书 2.4.3.7
server:
  port: 8010
spring:
  application:
    name: product-service
  # 激活 profile:打包时用 -Dp.env=dev(本地)或 -Dp.env=k8s(集群)切换
  profiles:
    active: ${p.env}
eureka:
  instance:
    # 使用 IP 地址注册，而不是主机名
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true

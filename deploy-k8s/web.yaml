# WIMS 前端(第 7 章选做):Vite + Vue3 单页应用部署清单
# 说明:镜像 tag 用 :v1.1 占位,与 deploy-k8s 下其它 yaml 一样
#      由 Jenkinsfile 的 sed 's|:v1\.1|:${version}|g' 统一替换为 BUILD_NUMBER
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: stockmgr
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: aliyun-registry
      containers:
        - name: web
          image: crpi-xltuiqx28nz2hmg1.cn-hangzhou.personal.cr.aliyuncs.com/my-wims/web:v1.1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: stockmgr
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30020

# WIMS 前端 Nginx 配置:
# ① 托管 Vue 构建产物(单页应用)
# ② 前端请求路径 /product /stock /inbound /outbound /alert /statistics
#    反代到集群内网关 Service(gateway-service:9999),
#    由网关 AuthFilter 统一鉴权(前端 axios 拦截器已注入 ?token=1)
server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # 命中网关 API 路径(不匹配则回落到上面的静态文件)
    location ~ ^/(product|stock|inbound|outbound|alert|statistics)/ {
        proxy_pass http://gateway-service.stockmgr.svc.cluster.local:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
